<!-- @dsCard height=340 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--surface); }
  .cover { position: relative; width: 960px; height: 340px; overflow: hidden; background: var(--surface); font-family: var(--font-sans); }
  svg { position: absolute; left: 0; top: 0; }
  .navy { fill: var(--navy-900); } .green { fill: var(--green-700); } .brand { fill: var(--green-500); }
  .blue { fill: var(--blue-500); } .lime { fill: var(--lime-400); } .on { fill: var(--on-accent); opacity: .9; }
  .blk { rx: var(--radius-xl); ry: var(--radius-xl); }
  .text { position: absolute; left: 40px; bottom: 32px; max-width: 520px; }
  .name { margin: 0; font-size: 64px; line-height: .95; font-weight: 800; letter-spacing: -1px; color: var(--ink); }
  .tag { margin: 12px 0 0; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink-secondary); }
</style>
</head>
<body>
<div class="cover">
<!--
  blocks: navy-900 280x112, green-700 360x112, blue-500 152x112, green-500 136x112 (bleeds right); corners radius-xl
  arrangement: top-band skeleton (name too wide for the 440px zone at 64px); one strip of unequal bands, space-3 gaps
  pattern: soft, friendly, large radii -> capsules, because every control in the system is a Capsule; 10 pills of pill-height/2 in lime-400 and on-accent across the green and navy bands
  steps and radii: gaps space-3 (12), pill height space-4 (16) with rx 8, pitch space-6 (24), radius-xl (24) on blocks
-->
<svg width="960" height="140" viewBox="0 0 960 140" aria-hidden="true">
  <rect class="navy blk" x="-24" y="16" width="304" height="112"/>
  <rect class="green blk" x="292" y="16" width="360" height="112"/>
  <rect class="blue blk" x="664" y="16" width="152" height="112"/>
  <rect class="brand blk" x="828" y="16" width="156" height="112"/>
  <!-- capsules -->
  <rect class="lime" x="316" y="40" width="96" height="16" rx="8"/>
  <rect class="on"   x="424" y="40" width="48" height="16" rx="8"/>
  <rect class="lime" x="484" y="40" width="144" height="16" rx="8"/>
  <rect class="on"   x="316" y="64" width="200" height="16" rx="8"/>
  <rect class="lime" x="528" y="64" width="64" height="16" rx="8"/>
  <rect class="on"   x="316" y="88" width="72" height="16" rx="8"/>
  <rect class="lime" x="400" y="88" width="120" height="16" rx="8"/>
  <rect class="on"   x="24"  y="88" width="120" height="16" rx="8"/>
  <rect class="lime" x="156" y="88" width="48" height="16" rx="8"/>
  <rect class="on"   x="688" y="88" width="104" height="16" rx="8"/>
</svg>
<div class="text">
  <p class="name">Cashout iOS<br>Design System</p>
  <p class="tag">Points, not pixels. Green for money, navy for waiting.</p>
</div>
</div>
</body>
</html>
